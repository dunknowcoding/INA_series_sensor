sentence=All-in-one INA-series current/voltage/power monitor library with standalone API and NiusRobotLab_INA_monitor JSONL streaming support.
paragraph=Supports INA219/220/226/228/229(SPI)/230-239/740X/3221/2227/4230/4235 including Q1 automotive variants. Two modes: JSONL streaming for the INA_monitor desktop tool, or direct readBusVoltage()/readCurrent()/readPower() API. Multi-platform: AVR, ESP32, ESP8266, RP2040, SAMD, STM32, megaAVR, Renesas, ArduinoNRF (nRF52), Adafruit/Mbed Nordic nRF52/nRF53. 69 ready-to-flash examples.
